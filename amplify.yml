version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          if [ -z "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "ERROR: VITE_FIREBASE_PROJECT_ID not set. Add env vars in App settings → Environment variables."
            exit 1
          fi
          echo "Firebase env vars OK"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
        - key: 'Cross-Origin-Opener-Policy'
          value: 'same-origin-allow-popups'
    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
